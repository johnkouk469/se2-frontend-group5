name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Run test script
        uses: cypress-io/github-action@v4
        with:
          build: npm run build
          start: npm run start
          command: npm run test
          install-command: npm ci --force
        env:
          TEST_TOKEN: ${{ secret.TEST_TOKEN }}
          TEST_USERNAME: ${{ secret.TEST_USERNAME }}
          TEST_ID: ${{ secret.TEST_ID }}
          TEST_EMAIL: ${{ secret.TEST_EMAIL }}
